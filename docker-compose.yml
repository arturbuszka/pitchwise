services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: api-dotnet
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis:6379"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://pitchwise:pitchwise@postgres:5432/pitchwise"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
