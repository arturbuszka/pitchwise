services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: api-dotnet
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis:6379"
      STORAGE_DIR: "/app/storage"
      # HLS signed-URL minting (must match the nginx edge secret).
      HLS_BASE_URL: "http://localhost:8080"
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      HLS_LINK_TTL_SECONDS: "3600"
      # Live server URL as seen by the browser (host port 8001 exposed by the worker).
      # Use 127.0.0.1 not localhost — on Windows/WSL2, localhost resolves to ::1 (IPv6)
      # which hits wslrelay instead of the Docker port proxy, causing ERR_CONNECTION_RESET.
      LIVE_WORKER_URL: "http://127.0.0.1:8001"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker-dotnet/Dockerfile
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # .NET worker/live share the API's schema → Npgsql connection string (not asyncpg).
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: "/app/storage"
      # Football model (player/ball/referee/goalkeeper) baked into the image.
      # Fallback: /app/models/yolo11n.onnx (COCO, person-only, no ball detection).
      YOLO_MODEL_PATH: "/app/models/football.onnx"
      # OSNet person-Re-ID model (export via vision-onnx/export_reid_onnx.py). Enables
      # stable per-player identity across track-id switches + a time-on-pitch report.
      # Leave unset to disable Re-ID (worker behaves as before).
      REID_MODEL_PATH: "/app/models/osnet_x0_25.onnx"
      LIVE_PIPELINE_MODE: "detect"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  # CDN-style edge: validates signed HLS URLs (secure_link) and caches segments,
  # so the .NET API never serves video bytes. storage/hls is written by the worker
  # and served read-only here.
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    environment:
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      # Only substitute our secret; leave nginx runtime vars ($uri, $arg_md5, …) intact.
      NGINX_ENVSUBST_FILTER: "HLS_SIGNING_SECRET"
    volumes:
      - ./storage/hls:/srv/hls:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - worker

  web:
    build:
      context: web
      dockerfile: Dockerfile
      # rewrites() is baked at build time (standalone) → the proxy destination must be
      # set here, not just at runtime.
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      # The browser uses relative /api/* (same-origin) → Next proxy. SSR and the proxy
      # run inside this container, so they reach the API via its service name.
      # NEXT_PUBLIC_API_URL is intentionally empty (baked at build → relative paths).
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
