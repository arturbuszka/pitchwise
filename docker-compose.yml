services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

  api:
    build:
      context: api-dotnet
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_CONNECTION: "Host=postgres;Port=5432;Database=pitchwise;Username=pitchwise;Password=pitchwise"
      REDIS_URL: "redis:6379"
      STORAGE_DIR: "/app/storage"
      # HLS signed-URL minting (must match the nginx edge secret).
      HLS_BASE_URL: "http://localhost:8080"
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      HLS_LINK_TTL_SECONDS: "3600"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: "postgresql+asyncpg://pitchwise:pitchwise@postgres:5432/pitchwise"
      REDIS_URL: "redis://redis:6379"
      STORAGE_DIR: "/app/storage"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  # CDN-style edge: validates signed HLS URLs (secure_link) and caches segments,
  # so the .NET API never serves video bytes. storage/hls is written by the worker
  # and served read-only here.
  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    environment:
      HLS_SIGNING_SECRET: "${HLS_SIGNING_SECRET:-devsecret}"
      # Only substitute our secret; leave nginx runtime vars ($uri, $arg_md5, …) intact.
      NGINX_ENVSUBST_FILTER: "HLS_SIGNING_SECRET"
    volumes:
      - ./storage/hls:/srv/hls:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - worker

  web:
    build:
      context: web
      dockerfile: Dockerfile
      # rewrites() is baked at build time (standalone) → the proxy destination must be
      # set here, not just at runtime.
      args:
        API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    environment:
      # The browser uses relative /api/* (same-origin) → Next proxy. SSR and the proxy
      # run inside this container, so they reach the API via its service name.
      # NEXT_PUBLIC_API_URL is intentionally empty (baked at build → relative paths).
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
